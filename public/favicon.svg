<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="url(#ring-grad)" stroke-width="14"/>

  <!-- Pulsing Outer Orbit -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring-grad)" stroke-width="6" opacity="0.35" stroke-dasharray="16 12"/>

  <!-- Graduation Cap & AI Sparkle Motif -->
  <g>
    <!-- Cap Roof -->
    <path d="M 256 120 L 420 200 L 256 280 L 92 200 Z" fill="url(#ring-grad)" filter="url(#glow)"/>
    
    <!-- Cap Base -->
    <path d="M 160 240 V 320 C 160 365 204 390 256 390 C 308 390 352 365 352 320 V 240" fill="none" stroke="#818cf8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cap Tassel -->
    <path d="M 400 210 V 310" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="400" cy="318" r="14" fill="#f59e0b"/>

    <!-- Central AI Sparkle Star -->
    <path d="M 256 150 L 272 195 L 317 211 L 272 227 L 256 272 L 240 227 L 195 211 L 240 195 Z" fill="#ffffff" filter="url(#glow)"/>
    <path d="M 350 120 L 356 138 L 374 144 L 356 150 L 350 168 L 344 150 L 326 144 L 344 138 Z" fill="#38bdf8"/>
  </g>
</svg>